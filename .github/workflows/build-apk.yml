name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'webapp/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChildSecurity-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: Child Security Android APK v1.0.0
          make_latest: true
          body: |
            ## 📱 Child Security Android APK (Doimiy 24/7 Foniy GPS)
            
            Ushbu APK ilova orqa fonda, telefon ekrani o'chiq va bloklangan holatda ham GPS joylashuvni uzluksiz yuborib turadi.
            
            ### 🚀 O'rnatish tartibi:
            1. `app-debug.apk` faylini yuklab oling va telefonga o'rnating.
            2. Ilovani oching va joylashuv ruxsatlarini "Doimiy ruxsat berish" (Allow all the time) deb belgilang.
            3. Farzand kodi orqali kiring.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
