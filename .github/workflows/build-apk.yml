name: Build Android APK & Play Store AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'webapp/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK + Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK and Play Store AAB with Gradle
        run: |
          cd android
          gradle assembleDebug bundleRelease --no-daemon --stacktrace
          mkdir -p build_dist
          cp app/build/outputs/apk/parent/debug/app-parent-debug.apk build_dist/ChildSecurity_Parent.apk || cp app/build/outputs/apk/debug/app-debug.apk build_dist/ChildSecurity_Parent.apk
          cp app/build/outputs/apk/child/debug/app-child-debug.apk build_dist/ChildSecurity_Child.apk || cp app/build/outputs/apk/debug/app-debug.apk build_dist/ChildSecurity_Child.apk
          cp build_dist/ChildSecurity_Child.apk build_dist/app-debug.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChildSecurity-APKs
          path: android/build_dist/*.apk
          if-no-files-found: warn

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChildSecurity-PlayStore-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: Child Security Android APK (Ota-ona & Farzand) v1.0.0
          make_latest: true
          body: |
            ## 📱 Child Security Android (Alohida Ota-ona va Farzand ilovalari)
            
            Ushbu relizda 2 ta alohida rasmiy APK taqdim etildi:
            1. **`ChildSecurity_Parent.apk`** — Ota-ona telefoni uchun monitoring boshqaruv pulti (xarita, ekran vaqti, ilovalarni bloklash, topshiriqlar).
            2. **`ChildSecurity_Child.apk`** — Farzand telefoni uchun (24/7 foniy GPS, SOS xavf tugmasi, ilovalar hisoboti va bloklash himoyasi).
            3. **`app-debug.apk`** — Universal muvofiqlik paketi.
            
            ### 🛡️ Imkoniyatlar:
            * **Ota-ona ilovasi:** Telefon kuzatilmaydi, faqat bolalarni nazorat qilish vositasi.
            * **Farzand ilovasi:** 24/7 foniy GPS, ruxsatlarni sozlamalardan o'chirishga qarshi PIN himoyasi.
          files: |
            android/build_dist/ChildSecurity_Parent.apk
            android/build_dist/ChildSecurity_Child.apk
            android/build_dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
