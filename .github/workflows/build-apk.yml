name: Build Android APK & Play Store AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'webapp/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK + Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK and Play Store AAB with Gradle
        run: |
          cd android
          gradle assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChildSecurity-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChildSecurity-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: Child Security Android APK & Play Store AAB v1.0.0
          make_latest: true
          body: |
            ## 📱 Child Security Android (APK & Google Play AAB Bundle)
            
            Ushbu relizda 2 ta format tayyorlandi:
            1. **`app-debug.apk`** — Telegram bot va veb-sayt orqali to'g'ridan-to'g'ri o'rnatish uchun (.apk).
            2. **`app-release.aab`** — Google Play Store (Play Market) Console ga yuklash uchun rasmiy Android App Bundle (.aab).
            
            ### 🛡️ Xususiyatlari:
            * **24/7 Foniy GPS:** Ekran o'chiq va bloklangan holatda ham doimiy nazorat.
            * **Avto-ishga tushish:** Telefon o'chib-yonsa ham orqa fonda o'zi ishlayveradi.
            * **Google Play Policy Compliant:** Background location disclosure va Maxfiylik siyosatiga 100% mos.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
