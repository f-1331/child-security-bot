<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Console — Telegram Serverless</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #090d16; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .card { max-width: 420px; width: 100%; background: #141c2f; border: 1px solid #2b3a59; border-radius: 18px; padding: 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.55); }
    h1 { font-size: 20px; margin: 0 0 8px; color: #fbbf24; }
    p { font-size: 14px; color: #94a3b8; margin: 0 0 18px; }
    .btn { display: inline-block; width: 100%; box-sizing: border-box; padding: 14px 18px; border-radius: 12px; background: #d97706; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; }
    .status { margin-top: 16px; font-size: 12px; color: #34d399; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👑 Owner Admin Console</h1>
    <p>Smart Parental Control — Yopiq Boshqaruv Markazi (24/7 Cloud)</p>
    <a class="btn" href="https://child-security-bot.vercel.app">🌐 Asosiy Boshqaruv Sayti</a>
    <div class="status" id="status">⚡ Server holati tekshirilmoqda...</div>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    if (tg && tg.Serverless && tg.Serverless.call) {
      tg.Serverless.call('status', {}, function (err, res) {
        const el = document.getElementById('status');
        if (err) {
          el.textContent = '⚠️ Edge status: ' + err.message;
        } else {
          const ok = res.vercel_backend && res.vercel_backend.status === 'healthy';
          const pg = res.neon_database && res.neon_database.status === 'connected';
          el.textContent = (ok ? '✅ Vercel: Faol' : '⚠️ Vercel') +
            ' | ' + (pg ? '🐘 Neon DB: Ulangan' : 'DB') +
            ' | Edge: ' + (res.edge_stats?.routed_events ?? 0);
        }
      });
    }
  </script>
</body>
</html>
