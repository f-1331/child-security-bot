[build]
  publish = "webapp"

[build.processing]
  skip_processing = true

[build.environment]
  NETLIFY_DRAWER_ENABLED = "false"

[[redirects]]
  from = "/api/*"
  to = "https://child-security-site.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
