[package]
name = "child_security_core"
version = "1.0.0"
edition = "2021"
authors = ["Child Security Team"]
description = "High-performance Rust Core for trajectory smoothing, offline geofencing, and anti-tamper security"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
