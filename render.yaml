services:
  - type: web
    name: child-security-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: DEBUG
        value: "false"
