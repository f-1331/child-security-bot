databases:
  - name: child-security-db
    databaseName: child_security
    user: child_admin
    plan: free
    region: frankfurt

services:
  - type: web
    name: child-security-site
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: child-security-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_BOT_TOKEN
        sync: false
      - key: OWNER_USERNAME
        value: fayzbek1331
      - key: TGCLOUD_APP_TOKEN
        sync: false
      - key: OWNER_TGCLOUD_APP_TOKEN
        sync: false
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: DEBUG
        value: "false"
